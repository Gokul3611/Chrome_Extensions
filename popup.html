<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple English Dictionary</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      min-height: 200px;
      max-height: 450px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 13.5px;
      color: #111827;
      background: #ffffff;
      padding: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 700;
    }
    .status-badge {
      font-size: 11px;
      background: #dcfce7;
      color: #15803d;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .input-box {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13.5px;
      outline: none;
    }
    input:focus {
      border-color: #2563eb;
    }
    button {
      padding: 6px 12px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    #result {
      max-height: 280px;
      overflow-y: auto;
    }
    .pos-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #2563eb;
      margin-top: 8px;
      margin-bottom: 3px;
    }
    ol {
      padding-left: 18px;
      margin-bottom: 8px;
    }
    li {
      margin-bottom: 4px;
      color: #374151;
    }
    .tip {
      font-size: 12px;
      color: #6b7280;
      background: #f9fafb;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #e5e7eb;
      line-height: 1.4;
    }
    .error {
      color: #dc2626;
      font-size: 13px;
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📖 Dictionary</h1>
    <span class="status-badge">Active</span>
  </div>

  <form id="search-form" class="input-box">
    <input type="text" id="word-input" placeholder="Type a word..." autofocus autocomplete="off" />
    <button type="submit">Define</button>
  </form>

  <div id="result">
    <div class="tip">
      👉 <strong>Tip:</strong> Double-click or highlight any word on any webpage you browse to see its definition in a simple popup window!
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
