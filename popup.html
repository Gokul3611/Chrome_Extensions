<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple English Dictionary</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --ink: #171717;
      --muted: #77736b;
      --line: #dedbd4;
      --paper: #f7f6f2;
      --surface: #ffffff;
      --accent: #c9f269;
      --danger: #b94a3f;
    }
    body {
      width: 348px;
      min-height: 200px;
      max-height: 520px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: var(--ink);
      background: var(--paper);
      padding: 18px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 15px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 17px;
      letter-spacing: -0.04em;
      font-weight: 800;
    }
    .status-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      background: var(--accent);
      color: var(--ink);
      padding: 5px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
      padding: 12px 13px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    #toggle-label {
      color: var(--muted);
      font-size: 12px;
    }
    .toggle-button {
      min-width: 76px;
      padding: 7px 10px;
    }
    .input-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(201, 242, 105, 0.5);
    }
    button {
      padding: 9px 14px;
      background: var(--ink);
      color: #ffffff;
      border: none;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 120ms ease, background 120ms ease;
    }
    button:hover {
      background: #3a3a38;
      transform: translateY(-1px);
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
      transform: none;
    }
    #result {
      max-height: 310px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .pos-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-top: 14px;
      margin-bottom: 5px;
    }
    ol {
      padding-left: 21px;
      margin-bottom: 10px;
    }
    li {
      margin-bottom: 6px;
      color: #41413e;
      line-height: 1.5;
    }
    .tip {
      font-size: 12px;
      color: var(--muted);
      background: var(--surface);
      padding: 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      line-height: 1.55;
    }
    .error {
      color: var(--danger);
      font-size: 13px;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Dictionary / 01</h1>
    <span id="status-badge" class="status-badge">Active</span>
  </div>

  <div class="toggle-row">
    <span id="toggle-label">Dictionary is active</span>
    <button id="toggle-button" class="toggle-button" type="button">Disable</button>
  </div>

  <form id="search-form" class="input-box">
    <input type="text" id="word-input" placeholder="Type a word..." autofocus autocomplete="off" />
    <button type="submit">Define</button>
  </form>

  <div id="result">
    <div class="tip">
      <strong>Quick lookup.</strong><br>
      Double-click or highlight any word on a webpage to see its definition.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
